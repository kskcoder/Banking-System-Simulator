spring.application.name=bankconfigservice
server.port=${SERVER_PORT:8888}

spring.cloud.config.server.enabled=true
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/kskcoder/Banking-System-Simulator-Config.git}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=${CONFIG_GIT_BRANCH:initialBranch}
spring.cloud.config.server.git.timeout=10
