version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - ./bankauthservice/.env:/tmp/bankauthservice.env:ro
      - ./bankaccountservice/.env:/tmp/bankaccountservice.env:ro
      - ./banktransactionservice/.env:/tmp/banktransactionservice.env:ro
      - ./bankpaymentservice/.env:/tmp/bankpaymentservice.env:ro
      - ./bankcardservice/.env:/tmp/bankcardservice.env:ro
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  bankconfigservice:
    build:
      context: .
      dockerfile: bankconfigservice/Dockerfile
    container_name: bankconfigservice
    ports:
      - "8888:8888"
    env_file:
      - bankconfigservice/.env
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8888' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  bankserviceregistry:
    build:
      context: .
      dockerfile: bankserviceregistry/Dockerfile
    container_name: bankserviceregistry
    ports:
      - "8761:8761"
    depends_on:
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankserviceregistry/.env
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8761' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  bankapigateway:
    build:
      context: .
      dockerfile: bankapigateway/Dockerfile
    container_name: bankapigateway
    ports:
      - "8765:8765"
    depends_on:
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankapigateway/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8765' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankauthservice:
    build:
      context: .
      dockerfile: bankauthservice/Dockerfile
    container_name: bankauthservice
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankauthservice/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankaccountservice:
    build:
      context: .
      dockerfile: bankaccountservice/Dockerfile
    container_name: bankaccountservice
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankaccountservice/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8085' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  banktransactionservice:
    build:
      context: .
      dockerfile: banktransactionservice/Dockerfile
    container_name: banktransactionservice
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - banktransactionservice/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8090' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankpaymentservice:
    build:
      context: .
      dockerfile: bankpaymentservice/Dockerfile
    container_name: bankpaymentservice
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankpaymentservice/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8100' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankmessagingservice:
    build:
      context: .
      dockerfile: bankmessagingservice/Dockerfile
    container_name: bankmessagingservice
    ports:
      - "8105:8105"
    depends_on:
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankmessagingservice/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8105' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankcardservice:
    build:
      context: .
      dockerfile: bankcardservice/Dockerfile
    container_name: bankcardservice
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - bankcardservice/.env
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_URL:-http://bankserviceregistry:8761/eureka}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8095' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  banking-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
