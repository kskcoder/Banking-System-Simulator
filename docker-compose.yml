version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      - public.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: postgres
    command: >
      bash -c "
      echo '#!/bin/bash' > /docker-entrypoint-initdb.d/01-create-databases.sh &&
      echo 'set -e' >> /docker-entrypoint-initdb.d/01-create-databases.sh &&
      echo 'env | grep \"_POSTGRES_DB=\" | while IFS=\"=\" read -r var_name db_name; do' >> /docker-entrypoint-initdb.d/01-create-databases.sh &&
      echo '  if [ -n \"\$$db_name\" ]; then' >> /docker-entrypoint-initdb.d/01-create-databases.sh &&
      echo '    psql -v ON_ERROR_STOP=1 --username \"\$$POSTGRES_USER\" --dbname \"\$$POSTGRES_DB\" -tc \"SELECT 1 FROM pg_database WHERE datname = '\''\$$db_name'\''\" | grep -q 1 || psql -v ON_ERROR_STOP=1 --username \"\$$POSTGRES_USER\" --dbname \"\$$POSTGRES_DB\" -c \"CREATE DATABASE \\\"\$$db_name\\\"\"' >> /docker-entrypoint-initdb.d/01-create-databases.sh &&
      echo '  fi' >> /docker-entrypoint-initdb.d/01-create-databases.sh &&
      echo 'done' >> /docker-entrypoint-initdb.d/01-create-databases.sh &&
      chmod +x /docker-entrypoint-initdb.d/01-create-databases.sh &&
      docker-entrypoint.sh postgres
      "
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  bankconfigservice:
    build:
      context: .
      dockerfile: bankconfigservice/Dockerfile
    container_name: bankconfigservice
    env_file:
      - public.env
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI_EXTERNAL:-https://github.com/kskcoder/Banking-System-Simulator-Config.git}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8888' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  bankserviceregistry:
    build:
      context: .
      dockerfile: bankserviceregistry/Dockerfile
    container_name: bankserviceregistry
    ports:
      - "8761:8761"
    depends_on:
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8761' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  bankapigateway:
    build:
      context: .
      dockerfile: bankapigateway/Dockerfile
    container_name: bankapigateway
    ports:
      - "8765:8765"
    depends_on:
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8765' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankauthservice:
    build:
      context: .
      dockerfile: bankauthservice/Dockerfile
    container_name: bankauthservice
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    environment:
      POSTGRES_DB: ${BANK_AUTH_POSTGRES_DB:-bankauthdb}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BANK_AUTH_POSTGRES_DB:-bankauthdb}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankaccountservice:
    build:
      context: .
      dockerfile: bankaccountservice/Dockerfile
    container_name: bankaccountservice
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    environment:
      POSTGRES_DB: ${BANK_ACCOUNT_POSTGRES_DB:-bankaccountdb}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BANK_ACCOUNT_POSTGRES_DB:-bankaccountdb}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8085' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  banktransactionservice:
    build:
      context: .
      dockerfile: banktransactionservice/Dockerfile
    container_name: banktransactionservice
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    environment:
      POSTGRES_DB: ${BANK_TRANSACTION_POSTGRES_DB:-banktransactiondb}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BANK_TRANSACTION_POSTGRES_DB:-banktransactiondb}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8090' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankpaymentservice:
    build:
      context: .
      dockerfile: bankpaymentservice/Dockerfile
    container_name: bankpaymentservice
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    environment:
      POSTGRES_DB: ${BANK_PAYMENT_POSTGRES_DB:-bankpaymentdb}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BANK_PAYMENT_POSTGRES_DB:-bankpaymentdb}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8100' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankmessagingservice:
    build:
      context: .
      dockerfile: bankmessagingservice/Dockerfile
    container_name: bankmessagingservice
    depends_on:
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
      - private.env
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8105' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bankcardservice:
    build:
      context: .
      dockerfile: bankcardservice/Dockerfile
    container_name: bankcardservice
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      bankserviceregistry:
        condition: service_healthy
      bankconfigservice:
        condition: service_healthy
    env_file:
      - public.env
    environment:
      POSTGRES_DB: ${BANK_CARD_POSTGRES_DB:-bankcarddb}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BANK_CARD_POSTGRES_DB:-bankcarddb}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8095' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  banking-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
