spring.application.name=bankapigateway

spring.config.import=optional:configserver:http://localhost:8888

logging.level.com.tejas.bankapigateway=INFO
logging.level.com.tejas.bankapigateway.configurations.JWTFilter=INFO
logging.level.com.tejas.bankapigateway.services.VendorValidation=WARN
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n