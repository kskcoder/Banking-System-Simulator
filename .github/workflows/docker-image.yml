name: Banking System Simulator Docker Deployment

on:
  push:
    branches: [ "release" ]

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bankconfigservice: ${{ steps.filter.outputs.bankconfigservice }}
      bankserviceregistry: ${{ steps.filter.outputs.bankserviceregistry }}
      bankapigateway: ${{ steps.filter.outputs.bankapigateway }}
      bankauthservice: ${{ steps.filter.outputs.bankauthservice }}
      bankaccountservice: ${{ steps.filter.outputs.bankaccountservice }}
      banktransactionservice: ${{ steps.filter.outputs.banktransactionservice }}
      bankpaymentservice: ${{ steps.filter.outputs.bankpaymentservice }}
      bankmessagingservice: ${{ steps.filter.outputs.bankmessagingservice }}
      bankcardservice: ${{ steps.filter.outputs.bankcardservice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.event.before || github.sha~1 }}
          filters: |
            bankconfigservice:
              - 'bankconfigservice/**'
            bankserviceregistry:
              - 'bankserviceregistry/**'
            bankapigateway:
              - 'bankapigateway/**'
            bankauthservice:
              - 'bankauthservice/**'
            bankaccountservice:
              - 'bankaccountservice/**'
            banktransactionservice:
              - 'banktransactionservice/**'
            bankpaymentservice:
              - 'bankpaymentservice/**'
            bankmessagingservice:
              - 'bankmessagingservice/**'
            bankcardservice:
              - 'bankcardservice/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.bankconfigservice == 'true' ||
      needs.detect-changes.outputs.bankserviceregistry == 'true' ||
      needs.detect-changes.outputs.bankapigateway == 'true' ||
      needs.detect-changes.outputs.bankauthservice == 'true' ||
      needs.detect-changes.outputs.bankaccountservice == 'true' ||
      needs.detect-changes.outputs.banktransactionservice == 'true' ||
      needs.detect-changes.outputs.bankpaymentservice == 'true' ||
      needs.detect-changes.outputs.bankmessagingservice == 'true' ||
      needs.detect-changes.outputs.bankcardservice == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bankconfigservice
            dockerfile: bankconfigservice/Dockerfile
          - service: bankserviceregistry
            dockerfile: bankserviceregistry/Dockerfile
          - service: bankapigateway
            dockerfile: bankapigateway/Dockerfile
          - service: bankauthservice
            dockerfile: bankauthservice/Dockerfile
          - service: bankaccountservice
            dockerfile: bankaccountservice/Dockerfile
          - service: banktransactionservice
            dockerfile: banktransactionservice/Dockerfile
          - service: bankpaymentservice
            dockerfile: bankpaymentservice/Dockerfile
          - service: bankmessagingservice
            dockerfile: bankmessagingservice/Dockerfile
          - service: bankcardservice
            dockerfile: bankcardservice/Dockerfile
    steps:
      - name: Check if service changed
        id: check-service
        run: |
          if [ "${{ needs.detect-changes.outputs[matrix.service] }}" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout code
        if: steps.check-service.outputs.changed == 'true'
        uses: actions/checkout@v4
      
      - name: Get and increment version for service
        if: steps.check-service.outputs.changed == 'true'
        id: version
        run: |
          VERSION_FILE="${{ matrix.service }}/VERSION"
          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(cat "$VERSION_FILE")
          else
            CURRENT_VERSION="0.0.0"
          fi
          
          IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
          MAJOR=${ADDR[0]}
          MINOR=${ADDR[1]}
          PATCH=${ADDR[2]}
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
      
      - name: Update version file
        if: steps.check-service.outputs.changed == 'true'
        run: |
          VERSION_FILE="${{ matrix.service }}/VERSION"
          echo "${{ steps.version.outputs.version }}" > "$VERSION_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "Bump ${{ matrix.service }} version to ${{ steps.version.outputs.version }}" || exit 0
          git push || exit 0
      
      - name: Set up Docker Buildx
        if: steps.check-service.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: steps.check-service.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        if: steps.check-service.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
