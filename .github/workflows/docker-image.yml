name: Banking System Simulator Docker Deployment

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all services (ignore change detection)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bankconfigservice: ${{ steps.filter.outputs.bankconfigservice || (github.event.inputs.force_build_all == 'true') }}
      bankserviceregistry: ${{ steps.filter.outputs.bankserviceregistry || (github.event.inputs.force_build_all == 'true') }}
      bankapigateway: ${{ steps.filter.outputs.bankapigateway || (github.event.inputs.force_build_all == 'true') }}
      bankauthservice: ${{ steps.filter.outputs.bankauthservice || (github.event.inputs.force_build_all == 'true') }}
      bankaccountservice: ${{ steps.filter.outputs.bankaccountservice || (github.event.inputs.force_build_all == 'true') }}
      banktransactionservice: ${{ steps.filter.outputs.banktransactionservice || (github.event.inputs.force_build_all == 'true') }}
      bankpaymentservice: ${{ steps.filter.outputs.bankpaymentservice || (github.event.inputs.force_build_all == 'true') }}
      bankmessagingservice: ${{ steps.filter.outputs.bankmessagingservice || (github.event.inputs.force_build_all == 'true') }}
      bankcardservice: ${{ steps.filter.outputs.bankcardservice || (github.event.inputs.force_build_all == 'true') }}
      bankingcommon: ${{ steps.filter.outputs.bankingcommon || (github.event.inputs.force_build_all == 'true') }}
      force_build_all: ${{ github.event.inputs.force_build_all == 'true' || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get previous commit SHA
        id: prev-commit
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            echo "sha=${PREV_SHA}" >> $GITHUB_OUTPUT
          fi
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ steps.prev-commit.outputs.sha }}
          filters: |
            bankconfigservice:
              - 'bankconfigservice/**'
            bankserviceregistry:
              - 'bankserviceregistry/**'
            bankapigateway:
              - 'bankapigateway/**'
            bankauthservice:
              - 'bankauthservice/**'
            bankaccountservice:
              - 'bankaccountservice/**'
            banktransactionservice:
              - 'banktransactionservice/**'
            bankpaymentservice:
              - 'bankpaymentservice/**'
            bankmessagingservice:
              - 'bankmessagingservice/**'
            bankcardservice:
              - 'bankcardservice/**'
            bankingcommon:
              - 'bankingcommon/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.bankconfigservice == 'true' ||
      needs.detect-changes.outputs.bankserviceregistry == 'true' ||
      needs.detect-changes.outputs.bankapigateway == 'true' ||
      needs.detect-changes.outputs.bankauthservice == 'true' ||
      needs.detect-changes.outputs.bankaccountservice == 'true' ||
      needs.detect-changes.outputs.banktransactionservice == 'true' ||
      needs.detect-changes.outputs.bankpaymentservice == 'true' ||
      needs.detect-changes.outputs.bankmessagingservice == 'true' ||
      needs.detect-changes.outputs.bankcardservice == 'true' ||
      needs.detect-changes.outputs.bankingcommon == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bankconfigservice
            dockerfile: bankconfigservice/Dockerfile
          - service: bankserviceregistry
            dockerfile: bankserviceregistry/Dockerfile
          - service: bankapigateway
            dockerfile: bankapigateway/Dockerfile
          - service: bankauthservice
            dockerfile: bankauthservice/Dockerfile
          - service: bankaccountservice
            dockerfile: bankaccountservice/Dockerfile
          - service: banktransactionservice
            dockerfile: banktransactionservice/Dockerfile
          - service: bankpaymentservice
            dockerfile: bankpaymentservice/Dockerfile
          - service: bankmessagingservice
            dockerfile: bankmessagingservice/Dockerfile
          - service: bankcardservice
            dockerfile: bankcardservice/Dockerfile
    steps:
      - name: Check if service changed
        id: check-service
        run: |
          SERVICE_CHANGED="${{ needs.detect-changes.outputs[matrix.service] }}"
          COMMON_CHANGED="${{ needs.detect-changes.outputs.bankingcommon }}"
          FORCE_BUILD="${{ needs.detect-changes.outputs.force_build_all }}"
          
          if [ "$SERVICE_CHANGED" == "true" ] || [ "$COMMON_CHANGED" == "true" ] || [ "$FORCE_BUILD" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            if [ "$FORCE_BUILD" == "true" ]; then
              echo "reason=force build all" >> $GITHUB_OUTPUT
            elif [ "$COMMON_CHANGED" == "true" ]; then
              echo "reason=bankingcommon changed" >> $GITHUB_OUTPUT
            else
              echo "reason=${{ matrix.service }} changed" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout code
        if: steps.check-service.outputs.changed == 'true'
        uses: actions/checkout@v4
      
      - name: Get and increment version for service
        if: steps.check-service.outputs.changed == 'true'
        id: version
        run: |
          VERSION_FILE="${{ matrix.service }}/VERSION"
          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(cat "$VERSION_FILE")
          else
            CURRENT_VERSION="0.0.0"
          fi
          
          IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
          MAJOR=${ADDR[0]}
          MINOR=${ADDR[1]}
          PATCH=${ADDR[2]}
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
          echo "Build reason: ${{ steps.check-service.outputs.reason }}"
      
      - name: Update version file
        if: steps.check-service.outputs.changed == 'true'
        run: |
          VERSION_FILE="${{ matrix.service }}/VERSION"
          echo "${{ steps.version.outputs.version }}" > "$VERSION_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "Bump ${{ matrix.service }} version to ${{ steps.version.outputs.version }}" || exit 0
          git push || exit 0
      
      - name: Set up Docker Buildx
        if: steps.check-service.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      
      - name: Login to Docker Hub
        if: steps.check-service.outputs.changed == 'true'
        run: |
          for i in {1..5}; do
            echo "Docker Hub login attempt $i/5"
            if echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin; then
              echo "Login successful"
              break
            else
              if [ $i -eq 5 ]; then
                echo "Login failed after 5 attempts"
                exit 1
              fi
              echo "Login failed, retrying in 15 seconds..."
              sleep 15
            fi
          done
      
      - name: Build and push Docker image
        if: steps.check-service.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          cache-to: type=inline
